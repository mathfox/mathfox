name: profile art

# Rebuilds the contribution snake and the brick skyline every 12 hours and publishes them
# to the `output` branch, which the README links to.
on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/profile-art.yml
      - .github/scripts/**

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_STATS_TOKEN: ${{ secrets.STATS_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5

      # Before the snake: the snake runs in a root container and leaves dist/ owned by root.
      - name: Brick skyline
        run: |
          mkdir -p dist
          python3 -I .github/scripts/bricks.py "${{ github.repository_owner }}" dist/bricks.svg

      - name: Keep the last punch card
        run: curl -sfL "https://raw.githubusercontent.com/${{ github.repository }}/output/activity.svg" -o dist/activity.svg || true

      # Commit times need a read-only token that sees private repositories; without it the
      # published activity.svg stays as it is.
      - name: Activity punch card
        if: env.HAS_STATS_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: python3 -I .github/scripts/activity.py "${{ github.repository_owner }}" dist/activity.svg 3

      - name: Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#1f6feb
            dist/snake-dark.svg?palette=github-dark&color_snake=#ffb703&color_dots=#161b22,#13448f,#0090ad,#5fae6c,#d99a00

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: regenerate profile art"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
